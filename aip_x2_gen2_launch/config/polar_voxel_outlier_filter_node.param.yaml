/**:
  ros__parameters:
    publish_noise_cloud: true                            # Publish a separate point cloud containing detected noise points
    publish_low_visibility_voxels: true                 # Publish selected low-visibility voxels as a debug point cloud
    radial_resolution_m: 0.5                              # Voxel grid resolution in the radial (distance) direction, in meters
    azimuth_resolution_rad: 0.05 # 0.0175                        # Voxel grid resolution in the azimuth (horizontal angle) direction, in radians (~1 degree)
    elevation_resolution_rad: 0.05 # 0.0175                      # Voxel grid resolution in the elevation (vertical angle) direction, in radians (~1 degree)
    voxel_points_threshold: 1                             # Minimum number of points required in a voxel to be considered valid
    min_radius_m: 0.5                                     # Minimum distance from the sensor to include points, in meters
    max_radius_m: 300.0                                   # Maximum distance from the sensor to include points, in meters
    visibility_estimation_max_range_m: 11.0               # Maximum range for estimating point cloud visibility, in meters
    #visibility_estimation_min_azimuth_rad: 0.047           # Minimum azimuth for estimating point cloud visibility, in radius
    #visibility_estimation_max_azimuth_rad: 6.093           # Maximum azimuth for estimating point cloud visibility, in radius
    visibility_estimation_min_azimuth_rad: 0.047           # Minimum azimuth for estimating point cloud visibility, in radius
    visibility_estimation_max_azimuth_rad: 6.093           # Maximum azimuth for estimating point cloud visibility, in radius
    visibility_estimation_min_elevation_rad: -0.36        # Minimum elevation for estimating point cloud visibility, in radius
    visibility_estimation_max_elevation_rad: 1.14         # Maximum elevation for estimating point cloud visibility, in radius
    visibility_estimation_max_secondary_voxel_count: 105  # Max number of secondary voxels to consider in visibility estimation
    visibility_estimation_only: true                      # If true, only perform visibility estimation without filtering
    use_return_type_classification: true                  # Use return type information to classify points (e.g., primary/secondary returns)
    filter_secondary_returns: false                       # If true, filter out secondary returns and keep only primary returns
    secondary_noise_threshold: 2                          # Threshold for classifying noise in secondary returns
    visibility_min_delta_radius_idx: 0                   # Min voxel index separation in radius for counting low-visibility voxels
    visibility_min_delta_azimuth_idx: 0                  # Min voxel index separation in azimuth for counting low-visibility voxels
    visibility_min_delta_elevation_idx: 0                # Min voxel index separation in elevation for counting low-visibility voxels
    low_visibility_entropy_threshold: 0.3                # Minimum normalized geometric Shannon entropy for low-visibility voxel selection
    low_visibility_anisotropy_threshold: 0.95             # Maximum normalized geometric anisotropy for low-visibility voxel selection
    intensity_threshold: 1                                # Minimum intensity value for a point to be considered valid
    primary_return_types: [1, 6, 8, 10]                   # List of return types considered as primary returns
    visibility_warn_threshold: 0.9                        # Warning threshold for visibility diagnostics
    filter_ratio_error_threshold: 0.5                     # Error threshold for filter ratio diagnostics
    filter_ratio_warn_threshold: 0.7                      # Warning threshold for filter ratio diagnostics
    visibility_error_threshold: 0.83                       # Error threshold for visibility diagnostics
    num_frames_hysteresis_transition: 330                 # The number of frames to be required to transition judgement
    immediate_report_error: false                         # Whether to report error state immediately if a single frame categorized as error
    immediate_relax_state: false                          # Whether to relax state if observed state is better than the current one
    publish_area_marker: false                            # Publish a marker to visualize region used for visibility estimation
    visibility_min_delta_radius_idx: 0           # Min voxel index separation in radius for counting low-visibility voxels
    visibility_min_delta_azimuth_idx: 0          # Min voxel index separation in azimuth for counting low-visibility voxels
    visibility_min_delta_elevation_idx: 0        # Min voxel index separation in elevation for counting low-visibility voxels
    
